# cam2 RGB + depth aligned to RGB, RGBD odometry, no IMU.
name: cam2_rgbd
description: cam2 (forward) RGB camera with the depth aligned to it, RGBD odometry
mode: rgbd
base_frame: cam2_link

cameras:
  - name: cam2_rgb
    image_topic: /cam2/color/image_raw
    camera_info_topic: /cam2/color/camera_info
    optical_frame: cam2_color_optical_frame

depth:
  topic: /cam2/aligned_depth_to_color/image_raw
  camera_index: 0                # aligned to cam2_rgb
  scale: 1000.0                  # D455 depth in millimeters
  stereo_tracking: false

hardware:
  ir_emitter: false

parameters:
  rectified_images: false        # the D455 RGB stream is distorted (plumb_bob)
  enable_image_denoising: false
  image_jitter_threshold_ms: 150.0
  enable_localization_n_mapping: true
