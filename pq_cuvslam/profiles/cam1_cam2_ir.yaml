# cam2 + cam1 IR stereo pairs, multicamera, no IMU (cuVSLAM supports the IMU with one stereo
# pair only). Same node parameters as the Isaac ROS 5 reference runs
# (cuvslam_stereo_cam1_cam2*.launch.py).
name: cam1_cam2_ir
description: cam2 (forward) and cam1 (down) infrared stereo pairs, multicamera odometry
mode: multicamera
base_frame: cam2_link

cameras:
  - name: cam2_ir1
    device: cam2
    image_topic: /cam2/infra1/image_rect_raw
    camera_info_topic: /cam2/infra1/camera_info
    optical_frame: cam2_infra1_optical_frame
  - name: cam2_ir2
    device: cam2
    image_topic: /cam2/infra2/image_rect_raw
    camera_info_topic: /cam2/infra2/camera_info
    optical_frame: cam2_infra2_optical_frame
  - name: cam1_ir1
    device: cam1
    image_topic: /cam1/infra1/image_rect_raw
    camera_info_topic: /cam1/infra1/camera_info
    optical_frame: cam1_infra1_optical_frame
  - name: cam1_ir2
    device: cam1
    image_topic: /cam1/infra2/image_rect_raw
    camera_info_topic: /cam1/infra2/camera_info
    optical_frame: cam1_infra2_optical_frame

# The bags have no TF between the two cameras (each D455 publishes its own tree).
extrinsics:
  - parent: cam2_link
    child: cam1_link
    translation: [-0.0134, 0.0, -0.0634]   # m
    rotation_rpy: [0.0, 0.8604, 0.0]       # rad (pitch +49.3 deg)
    source: >-
      translation from the holder CAD (D455_HOLDER.stp); pitch estimated from the two
      gyroscopes on the 17 bags
    date: null

# The two D455 are not triggered together: their capture times differ by up to half a frame
# and the phase drifts (tools/analyze_sync.py). Software sync: for each cam2 frame the nearest
# cam1 frame, warped to the cam2 capture time with the rotation measured by the cam1
# gyroscope. Use mode: hardware once the sync cable is installed, mode: none for the Isaac ROS
# behaviour (images grouped by sync_matching_threshold_ms).
sync:
  mode: software
  max_offset_ms: 34.0
  rotation_compensation: true
  compensation_border_px: 16
  devices:
    - name: cam2                       # reference: rig frames take its timestamps
      imu_topic: /cam2/imu
      imu_frame: cam2_gyro_optical_frame
      clock_offset_ms: 0.0             # gyroscope correlation: < 1 ms on the recorded bags
    - name: cam1
      imu_topic: /cam1/imu
      imu_frame: cam1_gyro_optical_frame
      clock_offset_ms: 0.0

hardware:
  ir_emitter: false

parameters:
  rectified_images: true
  enable_image_denoising: false
  image_jitter_threshold_ms: 150.0
  # Used only with sync.mode: none (frames of the two cameras are up to 33 ms apart).
  sync_matching_threshold_ms: 35.0
  enable_localization_n_mapping: true
  enable_ground_constraint_in_odometry: false
  enable_ground_constraint_in_slam: false
