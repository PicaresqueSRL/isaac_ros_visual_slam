# cam2 RGB + aligned depth + cam2 IMU: cuVSLAM Multisensor mode (cuVSLAM >= 17).
# Needs cuVSLAM >= 17 built with cuNLS; rejected otherwise. Experimental in cuVSLAM 17.
# cuVSLAM rejects a single RGB camera with IMU and no depth: Multisensor needs a depth image or
# two cameras with overlapping views.
name: cam2_rgbd_imu
description: cam2 (forward) RGB camera, aligned depth and IMU, multisensor odometry
mode: multisensor
base_frame: cam2_link

cameras:
  - name: cam2_rgb
    image_topic: /cam2/color/image_raw
    camera_info_topic: /cam2/color/camera_info
    optical_frame: cam2_color_optical_frame

depth:
  topic: /cam2/aligned_depth_to_color/image_raw
  camera_index: 0
  scale: 1000.0
  stereo_tracking: false

imu:
  topic: /cam2/imu
  frame: cam2_gyro_optical_frame
  noise:
    gyro_noise_density: 0.000244
    gyro_random_walk: 0.000019393
    accel_noise_density: 0.001862
    accel_random_walk: 0.003
    frequency: 200.0
    source: default
    date: null

hardware:
  ir_emitter: false

parameters:
  rectified_images: false
  enable_image_denoising: false
  image_jitter_threshold_ms: 150.0
  enable_localization_n_mapping: true
